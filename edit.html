<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>News Editor &mdash; Chamber of Commerce Bhuj</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
<style>

:root {
  --navy: #6b1f2a; --navy-dark: #4a1420; --navy-light: #8c3341;
  --gold: #d97706; --gold-light: #f2a93c; --gold-hover: #b45309;
  --bg: #ffffff; --bg-soft: #f8fafc; --text: #1f2937;
  --muted: #6b7280; --border: #e5e7eb; --wine-tint: #f8f0f1;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
button { font: inherit; cursor: pointer; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
.gradient-text {
  background: linear-gradient(135deg, var(--navy), var(--navy-light));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--navy-light);
}
.eyebrow::before { content: ""; height: 1px; width: 24px; background: var(--gold); flex-shrink: 0; }

/* ===== Header ===== */
.site-header {
  background: rgba(255,255,255,.98); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50; transition: box-shadow .25s var(--ease);
}
.site-header.scrolled { box-shadow: 0 2px 14px rgba(0,0,0,.06); }
.header-inner {
  max-width: 1240px; margin: 0 auto; padding: 6px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px; position: relative;
}
.logo { display: flex; align-items: center; gap: 12px; font-weight: 700; }
.logo-mark { width: 84px; height: 84px; object-fit: contain; flex-shrink: 0; display: none; opacity: 0; transition: opacity .5s var(--ease); }
.logo-mark.loaded { display: block; opacity: 1; }
.logo-text { line-height: 1.2; font-size: 1.15rem; color: var(--navy-dark); }
.logo-sub { display: block; font-size: 9px; font-weight: 500; color: var(--muted); letter-spacing: .16em; text-transform: uppercase; margin-top: 5px; }
@media (max-width: 480px) {
  .header-inner { padding: 6px 16px; }
  .logo-mark { width: 56px; height: 56px; }
  .logo-text { font-size: .95rem; }
  .logo-sub { display: none; }
}

.nav-menu ul { display: flex; gap: 18px; list-style: none; margin: 0; padding: 0; }
.nav-menu a {
  position: relative; display: inline-block; padding: 16px 0; font-size: 12.5px; font-weight: 550;
  color: #4e5157; white-space: nowrap; transition: color .2s var(--ease);
}
.nav-menu a::after {
  content: ""; position: absolute; left: 0; bottom: 8px; width: 0; height: 2px;
  border-radius: 1px; background: var(--gold); transition: width .25s var(--ease);
}
.nav-menu a:hover, .nav-menu a.active { color: var(--navy); }
.nav-menu a:hover::after, .nav-menu a.active::after { width: 100%; }
.nav-admin { color: var(--navy) !important; font-weight: 650; }

.nav-toggle {
  display: none; background: transparent; border: 1px solid var(--border); border-radius: 6px;
  width: 42px; height: 42px; cursor: pointer; padding: 0; position: relative; flex-shrink: 0;
}
.nav-toggle span {
  position: absolute; left: 11px; right: 11px; height: 2px; background: var(--navy);
  border-radius: 2px; transition: transform .2s var(--ease), top .2s var(--ease), opacity .2s var(--ease);
}
.nav-toggle span:nth-child(1) { top: 13px; }
.nav-toggle span:nth-child(2) { top: 20px; }
.nav-toggle span:nth-child(3) { top: 27px; }
.nav-toggle.open span:nth-child(1) { top: 20px; transform: rotate(45deg); }
.nav-toggle.open span:nth-child(2) { opacity: 0; }
.nav-toggle.open span:nth-child(3) { top: 20px; transform: rotate(-45deg); }
@media (max-width: 1080px) {
  .nav-toggle { display: block; }
  .nav-menu {
    display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff;
    border-bottom: 1px solid var(--border); padding: 10px 20px 20px;
    box-shadow: 0 12px 26px rgba(35,14,22,.09);
  }
  .nav-menu.open { display: block; }
  .nav-menu ul { flex-direction: column; gap: 2px; }
  .nav-menu a { display: block; padding: 13px 0; font-size: 14px; }
  .nav-menu a::after { bottom: 7px; }
}

/* ===== Buttons ===== */
.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
  gap: 10px; padding: 13px 24px; min-height: 46px; border-radius: 8px; font-size: 13.5px; font-weight: 650;
  border: 1px solid transparent; transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease), border-color .25s var(--ease);
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%); color: #fff;
  box-shadow: 0 4px 14px rgba(217,119,6,.35);
}
.btn-primary::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(110deg, transparent 25%, rgba(255,255,255,.28) 50%, transparent 75%);
  transform: translateX(-120%); transition: transform .6s var(--ease); pointer-events: none;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(217,119,6,.43); }
.btn-primary:hover::after { transform: translateX(120%); }
.btn-outline { background: transparent; color: var(--navy); border-color: #d8bec3; }
.btn-outline:hover { background: var(--wine-tint); border-color: var(--navy-light); transform: translateY(-2px); }
.btn-outline-light { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
.btn-outline-light:hover { background: rgba(255,255,255,.12); border-color: #fff; transform: translateY(-2px); }
.btn-small { min-height: 38px; padding: 9px 16px; font-size: 12px; }
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none !important; }

/* ===== Cards ===== */
.card {
  background: #fff; border: 1px solid var(--border); border-radius: 13px;
  transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
}
.card:hover {
  transform: translateY(-4px); box-shadow: 0 12px 32px rgba(107,31,42,.12), 0 2px 8px rgba(0,0,0,.04);
  border-color: var(--navy-light);
}
.photo-wrap { position: relative; overflow: hidden; background: #efe8e9; }
.photo-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.card:hover .photo-wrap img, a:hover .photo-wrap img, button:hover .photo-wrap img { transform: scale(1.05); }
.image-fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #b99ba2; background: var(--wine-tint);
}

/* ===== Reveal animation ===== */
.reveal {
  opacity: 0; transform: translateX(-40px);
  transition: opacity .7s var(--ease), transform .7s var(--ease);
}
.reveal.reveal-right { transform: translateX(40px); }
.reveal.reveal-visible { opacity: 1; transform: translateX(0); }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
}

/* ===== Page header ===== */
.page-hero {
  position: relative; overflow: hidden; padding: 52px 0 54px;
  background: radial-gradient(ellipse at 100% 0%, rgba(217,119,6,.07), transparent 48%),
              radial-gradient(ellipse at 0% 100%, rgba(107,31,42,.06), transparent 55%), #fcf9f8;
  border-bottom: 1px solid var(--border);
}
.page-hero h1 { font-size: clamp(1.8rem, 3.5vw, 2.4rem); font-weight: 700; margin: 0 0 10px; letter-spacing: -.02em; }
.page-hero p { color: var(--muted); margin: 0; max-width: 600px; font-size: 15px; }

/* ===== Section basics ===== */
.section { padding: 72px 0; }
.section-soft { background: var(--bg-soft); }
.section-heading { text-align: center; margin-bottom: 38px; }
.section-heading h2 { font-size: clamp(1.5rem, 2.6vw, 1.8rem); font-weight: 700; margin: 0 0 10px; }
.section-heading p { color: var(--muted); margin: 0; max-width: 560px; margin-inline: auto; font-size: .98rem; }

/* ===== Icons ===== */
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: middle; }

/* ===== States (loading / empty / error) ===== */
.state-block { text-align: center; padding: 64px 20px; grid-column: 1 / -1; }
.state-icon {
  display: inline-flex; align-items: center; justify-content: center; width: 68px; height: 68px;
  color: var(--navy-light); background: var(--wine-tint); border-radius: 50%; margin-bottom: 20px;
}
.state-icon .icon { width: 28px; height: 28px; }
.state-block h3 { font-size: 1.2rem; font-weight: 650; color: var(--navy); margin: 0 0 8px; }
.state-block p { color: var(--muted); font-size: .92rem; max-width: 420px; margin: 0 auto; }
.state-block .btn { margin-top: 20px; }
.spinner {
  width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--navy);
  border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Forms ===== */
.admin-form { max-width: 640px; background: #fff; border: 1px solid var(--border); border-radius: 13px; padding: 26px; margin-bottom: 32px; }
.admin-form h2 { margin: 0 0 18px; font-size: 1.15rem; color: var(--navy); font-weight: 700; }
.form-row { margin-bottom: 15px; }
.form-row label { display: block; font-size: .85rem; font-weight: 650; margin-bottom: 6px; color: var(--text); }
.form-row .req { color: #a63842; margin-left: 2px; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 10px 13px; font-size: .93rem; font-family: inherit;
  background: #fff; border: 1px solid var(--border); border-radius: 8px; outline: none; color: var(--text);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
  border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(107,31,42,.08);
}
.form-row textarea { min-height: 90px; resize: vertical; }
.form-status { padding: 10px 13px; border-radius: 8px; font-size: .88rem; margin-bottom: 12px; border: 1px solid transparent; display: none; }
.form-status.visible { display: block; }
.form-status.success { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.form-status.error { background: #fef2f2; color: #a63842; border-color: #fecaca; }

/* ===== Footer ===== */
.site-footer { background: var(--navy-dark); color: rgba(255,255,255,.85); padding: 34px 20px; text-align: center; font-size: .88rem; }
.site-footer p { margin: 0; }
.site-footer .footer-brand { font-weight: 650; color: #fff; margin-bottom: 4px; }
.site-footer .contact { opacity: .7; margin-top: 10px; font-size: .82rem; }

  .topbar { background: linear-gradient(135deg, var(--navy), var(--navy-dark)); color: #fff; padding: 22px 0; }
  .topbar .container { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .topbar h1 { font-size: 1.25rem; margin: 0; font-weight: 700; }
  .topbar a { color: var(--gold-light); font-size: .85rem; font-weight: 600; }
  .editor-wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; }
  .editor-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 26px; margin-bottom: 28px; }
  .editor-card h2 { font-size: 1.15rem; margin: 0 0 18px; color: var(--navy); font-weight: 700; }
  .edit-banner {
    display: none; padding: 10px 14px; background: var(--wine-tint); color: var(--navy);
    border-radius: 8px; font-size: .85rem; margin-bottom: 16px;
  }
  .edit-banner.visible { display: block; }
  .post-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: .9rem; }
  .post-row:last-child { border-bottom: none; }
  .post-row img { width: 60px; height: 44px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .post-row .post-info { flex: 1; min-width: 0; }
  .post-row strong { display: block; }
  .post-row .post-cat { color: var(--muted); font-size: .8rem; }
  .post-row .post-actions { display: flex; gap: 6px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="topbar">
  <div class="container">
    <h1>News Editor</h1>
    <a href="index.html">&larr; View site</a>
  </div>
</div>

<main>
  <div class="editor-wrap">
    <div class="editor-card">
      <h2 id="formHeading">Post a news update</h2>
      <div class="edit-banner" id="editBanner"><strong>Editing:</strong> <span id="editTitle"></span> &mdash; <a href="#" id="cancelEdit" style="color:var(--navy);font-weight:650">Cancel</a></div>
      <div class="form-status" id="formStatus"></div>
      <form id="newsForm" novalidate>
        <div class="form-row"><label>Title <span class="req">*</span></label><input id="f-title" required /></div>
        <div class="form-row"><label>Category</label><input id="f-category" placeholder="e.g. Announcement" /></div>
        <div class="form-row"><label>Author</label><input id="f-author" /></div>
        <div class="form-row"><label>Body</label><textarea id="f-body" rows="7"></textarea></div>
        <div class="form-row">
          <label>Image</label>
          <div class="upload-row" style="display:flex;gap:10px;align-items:center">
            <button type="button" class="btn btn-outline btn-small" id="uploadBtn">Upload image</button>
            <div class="upload-preview" id="preview"><img id="previewImg" alt="" /></div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Publish</button>
      </form>
    </div>
    <div class="editor-card">
      <h2>Existing Posts</h2>
      <div id="postsList"><div class="state-block"><div class="spinner"></div>Loading posts...</div></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <p class="footer-brand">Chamber of Commerce Bhuj</p>
    <p>&copy; Chamber of Commerce Bhuj. All rights reserved.</p>
  </div>
</footer>

<script>
  (function () {
    var supabaseClient = supabase.createClient("https://rvpiliwyqjowegmjcanr.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2cGlsaXd5cWpvd2VnbWpjYW5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMDM2MjksImV4cCI6MjEwMjg3OTYyOX0.9ZQj69FLcFgqp8huYTqlWy4JGl-vYGmYZiiVUBo4Sio");
    var uploadedImageUrl = "";
    var editingId = null;
    var uploadWidget = null;

    var form = document.getElementById("newsForm");
    var formStatus = document.getElementById("formStatus");
    var submitBtn = document.getElementById("submitBtn");
    var postsList = document.getElementById("postsList");
    var editBanner = document.getElementById("editBanner");
    var editTitle = document.getElementById("editTitle");
    var formHeading = document.getElementById("formHeading");

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }

    function showStatus(type, message) {
      formStatus.className = "form-status visible " + type;
      formStatus.textContent = message;
      if (type === "success") setTimeout(function () { formStatus.classList.remove("visible"); }, 3500);
    }

    function initWidget() {
      if (typeof cloudinary === "undefined" || !cloudinary.createUploadWidget) return;
      uploadWidget = cloudinary.createUploadWidget({
        cloudName: "c3josacx",
        uploadPreset: "coc_bhuj_news",
        folder: "coc-bhuj-news",
        cropping: true,
        multiple: false,
        maxFiles: 1,
        clientAllowedFormats: ["png", "jpg", "jpeg", "gif", "webp", "heic", "heif"]
      }, function (error, result) {
        if (error) { showStatus("error", "Upload failed: " + (error.message || "Unknown error")); return; }
        if (result && result.event === "success" && result.info && result.info.secure_url) {
          uploadedImageUrl = result.info.secure_url;
          document.getElementById("previewImg").src = uploadedImageUrl;
          document.getElementById("preview").classList.add("visible");
        }
      });
    }
    document.getElementById("uploadBtn").addEventListener("click", function () {
      if (uploadWidget) uploadWidget.open(); else showStatus("error", "Upload widget not ready.");
    });

    function resetForm() {
      form.reset();
      uploadedImageUrl = "";
      document.getElementById("preview").classList.remove("visible");
      editingId = null;
      editBanner.classList.remove("visible");
      formHeading.textContent = "Post a news update";
      submitBtn.textContent = "Publish";
    }
    document.getElementById("cancelEdit").addEventListener("click", function (e) { e.preventDefault(); resetForm(); });

    function startEdit(post) {
      editingId = post.id;
      document.getElementById("f-title").value = post.title || "";
      document.getElementById("f-category").value = post.category || "";
      document.getElementById("f-author").value = post.author || "";
      document.getElementById("f-body").value = post.body || "";
      uploadedImageUrl = post.image_url || "";
      if (uploadedImageUrl) {
        document.getElementById("previewImg").src = uploadedImageUrl;
        document.getElementById("preview").classList.add("visible");
      } else {
        document.getElementById("preview").classList.remove("visible");
      }
      editBanner.classList.add("visible");
      editTitle.textContent = post.title || "(untitled)";
      formHeading.textContent = "Edit news post";
      submitBtn.textContent = "Save changes";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deletePost(post) {
      if (!confirm('Delete "' + (post.title || "this post") + '"? This cannot be undone.')) return;
      try {
        var result = await supabaseClient.from("news_posts").delete().eq("id", post.id);
        if (result.error) throw result.error;
        if (editingId === post.id) resetForm();
        await loadPosts();
      } catch (err) { console.error(err); showStatus("error", "Couldn't delete post: " + (err.message || "Unknown error")); }
    }

    async function loadPosts() {
      postsList.innerHTML = '<div class="state-block"><div class="spinner"></div>Loading posts...</div>';
      try {
        var result = await supabaseClient.from("news_posts").select("*").order("published_at", { ascending: false, nullsFirst: false }).limit(30);
        if (result.error) throw result.error;
        var posts = result.data || [];
        postsList.innerHTML = "";
        if (posts.length === 0) { postsList.innerHTML = '<p style="color:var(--muted)">No posts yet.</p>'; return; }
        posts.forEach(function (p) {
          var row = document.createElement("div");
          row.className = "post-row";
          if (p.image_url) {
            var img = document.createElement("img");
            img.src = p.image_url; img.alt = "";
            row.appendChild(img);
          }
          var info = document.createElement("div");
          info.className = "post-info";
          var strong = document.createElement("strong");
          strong.textContent = p.title || "(untitled)";
          info.appendChild(strong);
          if (p.category) {
            var cat = document.createElement("div");
            cat.className = "post-cat";
            cat.textContent = p.category;
            info.appendChild(cat);
          }
          row.appendChild(info);
          var actions = document.createElement("div");
          actions.className = "post-actions";
          var editBtn = document.createElement("button");
          editBtn.type = "button"; editBtn.className = "action-btn add"; editBtn.textContent = "Edit";
          editBtn.addEventListener("click", function () { startEdit(p); });
          var delBtn = document.createElement("button");
          delBtn.type = "button"; delBtn.className = "action-btn delete"; delBtn.textContent = "Delete";
          delBtn.addEventListener("click", function () { deletePost(p); });
          actions.appendChild(editBtn); actions.appendChild(delBtn);
          row.appendChild(actions);
          postsList.appendChild(row);
        });
      } catch (err) {
        console.error(err);
        postsList.innerHTML = '<p style="color:#a63842">Couldn\'t load posts. ' + escapeHtml(err.message || "") + '</p>';
      }
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var title = document.getElementById("f-title").value.trim();
      if (!title) { showStatus("error", "Title is required."); return; }
      submitBtn.disabled = true;
      submitBtn.textContent = editingId ? "Saving..." : "Publishing...";
      var row = {
        title: title,
        category: document.getElementById("f-category").value.trim() || null,
        author: document.getElementById("f-author").value.trim() || null,
        body: document.getElementById("f-body").value.trim() || null,
        image_url: uploadedImageUrl || null
      };
      try {
        var result;
        if (editingId) {
          result = await supabaseClient.from("news_posts").update(row).eq("id", editingId);
        } else {
          row.published_at = new Date().toISOString();
          result = await supabaseClient.from("news_posts").insert([row]);
        }
        if (result.error) throw result.error;
        showStatus("success", editingId ? "Post updated successfully." : "Post published successfully.");
        resetForm();
        await loadPosts();
      } catch (err) {
        console.error(err);
        showStatus("error", "Couldn't save post: " + (err.message || "Unknown error"));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = editingId ? "Save changes" : "Publish";
      }
    });

    initWidget();
    loadPosts();
  })();
</script>

</body>
</html>
